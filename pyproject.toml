[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gdm-reduce"
version = "0.1.0a1"
description = "Phase-aware Kron reduction for grid-data-models distribution systems"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.24", "scipy>=1.10", "networkx>=3", "grid-data-models>=2.4.0"]

[project.scripts]
gdm-reduce = "gdm_reduce.cli:main"

[project.urls]
Repository = "https://github.com/NLR-Distribution-Suite/gdm-reduce"

[project.optional-dependencies]
flow = ["gdm-flow>=0.5.0"]
opendss = ["opendssdirect.py>=0.9"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pre-commit>=3.7", "build>=1"]
docs = ["gdm-flow>=0.5.0", "gdmloader>=0.0.5", "matplotlib>=3.8", "nbformat>=5.10", "nbclient>=0.10", "nbconvert>=7", "ipykernel>=6", "jupyter-book>=2,<3"]
conversion = ["NREL-ditto", "opendssdirect.py>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.coverage.run]
source = ["gdm_reduce"]

[tool.coverage.report]
show_missing = true
fail_under = 90